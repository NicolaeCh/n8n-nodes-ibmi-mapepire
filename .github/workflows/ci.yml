name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Build and lint with the supported n8n development toolchain.
          # The exact packed artifact is tested separately on Node.js 26.5.0.
          node-version: 24
          cache: npm
      - name: Install exact development toolchain
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint, build, test, audit, and verify
        run: npm run ci:verify
      - name: Pack the verified scoped node
        run: |
          mkdir -p release
          npm pack --pack-destination release
          TARBALL="$(node tools/package-artifact-name.mjs release)"
          node tools/verify-tarball.mjs "$TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: ibmi-db2-mapepire-package
          path: release/*.tgz
          if-no-files-found: error

  runtime-node26:
    needs: build-and-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - uses: actions/download-artifact@v4
        with:
          name: ibmi-db2-mapepire-package
          path: release
      - name: Verify clean Node.js 26 production installation
        run: |
          node --version
          npm --version
          TARBALL="$(node tools/package-artifact-name.mjs release)"
          node tools/verify-tarball.mjs "$TARBALL"
